<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sélecteur et état de run</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/css/components/accessibility.css">
  <link rel="stylesheet" href="/static/css/components/button.css">
  <link rel="stylesheet" href="/static/css/components/topbar.css">
  <link rel="stylesheet" href="/static/css/components/status-pill.css">
  <link rel="stylesheet" href="/static/css/components/switch.css">
  <link rel="stylesheet" href="/static/css/components/banner.css">
  <link rel="stylesheet" href="/static/css/components/badge.css">
  <link rel="stylesheet" href="/static/css/components/metric.css">
  <link rel="stylesheet" href="/static/css/components/error.css">
  <link rel="stylesheet" href="/static/css/components/layout.css">
  <link rel="stylesheet" href="/static/css/components/model-picker.css">
  <link rel="stylesheet" href="/static/css/components/run-status.css">
  <link rel="stylesheet" href="/static/css/components/export-menu.css">

  <script type="module" src="/__fixtures__/picker.js"></script>
</head>
<body>
  <main>
    <h1>Sélecteur et état de run</h1>

    <section aria-labelledby="single-title">
      <h2 id="single-title">Choix unique</h2>
      <wl-model-picker id="single"></wl-model-picker>
    </section>

    <section aria-labelledby="multi-title">
      <h2 id="multi-title">Choix multiple</h2>
      <wl-model-picker id="multi" multi purpose="arena"></wl-model-picker>
    </section>

    <section aria-labelledby="status-title">
      <h2 id="status-title">Run</h2>
      <wl-run-status id="status" hidden></wl-run-status>
    </section>

    <p><button class="btn" id="after" type="button">Après</button></p>
  </main>
</body>
</html>
