<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Composants partagés</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/components.css">
  <script type="module" src="/__fixtures__/components.js"></script>
</head>
<body>
  <main>
    <h1>Composants partagés</h1>

    <section aria-labelledby="badges-title">
      <h2 id="badges-title">Badges</h2>
      <ul id="badges">
        <li><wl-badge kind="local"></wl-badge></li>
        <li><wl-badge kind="cloud"></wl-badge></li>
        <li><wl-badge kind="unknown"></wl-badge></li>
        <li><wl-badge></wl-badge></li>
        <li><wl-badge kind="indicative"></wl-badge></li>
        <li><wl-badge kind="single-judge"></wl-badge></li>
        <li><wl-badge kind="estimated"></wl-badge></li>
        <li><wl-badge kind="unmeasurable"></wl-badge></li>
      </ul>
    </section>

    <section aria-labelledby="metrics-title">
      <h2 id="metrics-title">Métriques</h2>
      <wl-metric id="metric-plain" label="Chargement" value="3,2" unit="s"></wl-metric>
      <wl-metric id="metric-help" label="Débit" value="38" unit="tokens/s"
                 help="Tokens générés par seconde, mesurés par Ollama."></wl-metric>
      <wl-metric id="metric-provisional" label="Débit en cours" value="41" unit="tokens/s"
                 provisional></wl-metric>
    </section>

    <section aria-labelledby="error-title">
      <h2 id="error-title">Erreur</h2>
      <wl-error id="error"></wl-error>
    </section>
  </main>
</body>
</html>
