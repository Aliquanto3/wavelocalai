          Lisez le compte rendu suivant, puis rédigez-en une synthèse de 60 à 90 mots, en un seul paragraphe, destinée aux élus qui n'ont pas assisté à la réunion. Ne reprenez aucune phrase mot pour mot et ne donnez aucun avis personnel.

          Texte :
          « La commission transports de la communauté de communes fictive du Val d'Aubière s'est réunie le 4 avril pour examiner le bilan de la navette à la demande lancée il y a un an. Le service, qui fonctionne sur réservation téléphonique la veille avant 18 h, a transporté 8 400 voyageurs sur l'année, soit 30 % de plus que l'objectif initial. Les principaux usagers sont des personnes âgées de plus de 70 ans, qui représentent près de la moitié des trajets, et des jeunes de moins de 18 ans se rendant au lycée de Montbrac. Le coût net pour la collectivité s'élève à 112 000 euros, contre 95 000 euros prévus, en raison de la hausse du prix du carburant. Les usagers interrogés se disent satisfaits à 87 %, mais regrettent l'impossibilité de réserver le jour même. Le prestataire a proposé une application de réservation qui permettrait de réserver jusqu'à deux heures avant le départ, pour un coût de mise en place de 18 000 euros. La commission recommande de prolonger le service pour deux ans et de lancer une étude sur l'application avant toute décision. Le vote aura lieu au conseil communautaire du 22 mai. »
    grader_params: {}
    target: null
    criteria:
      - {id: c1, question: "La synthèse fait-elle entre 60 et 90 mots ?"}
      - {id: c2, question: "La synthèse tient-elle en un seul paragraphe ?"}
      - {id: c3, question: "La synthèse mentionne-t-elle le dépassement du coût (112 000 euros au lieu de 95 000 euros) ?"}
      - {id: c4, question: "La synthèse mentionne-t-elle la recommandation de prolonger le service pour deux ans ?"}
      - {id: c5, question: "La synthèse mentionne-t-elle le vote prévu au conseil communautaire du 22 mai ?"}
      - {id: c6, question: "La synthèse s'abstient-elle de tout avis personnel ou jugement de valeur sur le service ?"}
