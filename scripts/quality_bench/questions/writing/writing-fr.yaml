questions:
  - number: 1
    messages:
      - role: user
        content: |-
          Rédigez un courriel de réclamation adressé au service client de la société fictive « Meubles Tilleul ». Situation : vous avez commandé le 3 février une table en chêne (commande n° MT-48213, 649 euros) livrée le 21 février avec un pied fendu. Vous avez envoyé des photos le 22 février et n'avez reçu aucune réponse depuis.

          Contraintes :
          - Commencez par une ligne « Objet : » qui mentionne le numéro de commande.
          - Le corps du courriel comporte exactement trois paragraphes : rappel des faits, demande précise (remplacement du pied sous quinze jours, ou à défaut remboursement intégral), conséquence si rien n'est fait (saisine du médiateur de la consommation).
          - Vouvoiement de bout en bout, ton ferme mais courtois, aucune menace autre que la saisine du médiateur.
          - Terminez par la formule « Je vous prie d'agréer, Madame, Monsieur, mes salutations distinguées. » suivie de la signature « Claire Fontanel ».
    grader_params: {}
    target: null
    criteria:
      - {id: c1, question: "La réponse commence-t-elle par une ligne « Objet : » contenant le numéro MT-48213 ?"}
      - {id: c2, question: "Le corps du courriel comporte-t-il exactement trois paragraphes entre la formule d'appel et la formule de politesse ?"}
      - {id: c3, question: "Le courriel mentionne-t-il à la fois le remplacement sous quinze jours et, à défaut, le remboursement intégral ?"}
      - {id: c4, question: "Le courriel mentionne-t-il la saisine du médiateur de la consommation comme conséquence possible ?"}
      - {id: c5, question: "Le courriel se termine-t-il par la formule « Je vous prie d'agréer, Madame, Monsieur, mes salutations distinguées. » suivie de la signature Claire Fontanel ?"}
