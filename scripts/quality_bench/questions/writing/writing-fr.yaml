          Résumez le texte suivant en exactement trois puces, chacune d'une seule phrase de moins de 25 mots. La première puce donne le constat, la deuxième la cause, la troisième la mesure décidée.

          Texte :
          « Depuis le début de l'année, l'usine fictive Cartonnages Merlet, à Saint-Ondras, constate une hausse inhabituelle des arrêts de la ligne d'impression numéro 2 : quarante-trois arrêts en six mois, contre douze sur la même période l'an dernier. Chaque arrêt dure en moyenne quarante minutes et entraîne la mise au rebut de plusieurs centaines de feuilles. L'équipe de maintenance a d'abord soupçonné l'usure des rouleaux encreurs, qui ont été remplacés en mars sans effet notable. Une analyse plus poussée, menée avec le fabricant de la machine, a montré que la plupart des arrêts survenaient l'après-midi, lorsque la température de l'atelier dépassait 29 degrés. À cette température, l'encre utilisée depuis le changement de fournisseur en janvier devient trop fluide et déclenche les capteurs de sécurité. La direction a donc décidé de revenir à l'ancienne encre dès le mois prochain, en attendant l'installation d'un système de climatisation de l'atelier, prévue pour l'été suivant. Le coût de ces arrêts est estimé à 27 000 euros sur le semestre. »
    grader_params: {}
    target: null
    criteria:
      - {id: c1, question: "Le résumé comporte-t-il exactement trois puces ?"}
      - {id: c2, question: "Chaque puce est-elle composée d'une seule phrase de moins de 25 mots ?"}
      - {id: c3, question: "La deuxième puce identifie-t-elle comme cause l'encre devenue trop fluide au-delà d'environ 29 degrés ?"}
      - {id: c4, question: "La troisième puce mentionne-t-elle le retour à l'ancienne encre ?"}
