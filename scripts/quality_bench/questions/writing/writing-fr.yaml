        content: |-
          Résumez le témoignage suivant en un paragraphe de 50 à 80 mots, écrit à la troisième personne et au présent. Le résumé doit conserver les trois chiffres clés du texte.

          Texte :
          « Je m'appelle Maëlle, j'ai repris la boulangerie de mon oncle à Lescourt, un village fictif de 900 habitants, il y a quatre ans. Quand je suis arrivée, la boutique ouvrait six jours sur sept et je travaillais près de soixante-dix heures par semaine. Les premiers mois ont été très durs : je faisais tout moi-même, du pétrissage à la caisse. Puis j'ai décidé de changer d'organisation. J'ai embauché une apprentie, j'ai fermé le lundi et le mardi, et j'ai mis en place un système de précommande par SMS pour les week-ends. Résultat : le chiffre d'affaires n'a pas baissé, il a même progressé de 15 % la deuxième année, parce que je gaspille beaucoup moins de pain. Aujourd'hui, je travaille environ quarante-cinq heures par semaine. Ce que je dirais aux jeunes artisans, c'est qu'ouvrir moins ne veut pas forcément dire vendre moins. Il faut écouter ses clients et oser essayer. »
    grader_params: {}
    target: null
    criteria:
