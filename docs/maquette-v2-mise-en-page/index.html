<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maquette - mise en page v2</title>
<meta name="description" content="Maquette statique (story 9.6) de la nouvelle mise en page de wavelocalai v2 : grille à deux colonnes, hiérarchie, couleur par module." />
<style>
/* ===== Jetons (DESIGN.md, amendements proposés par cette story, voir DECISIONS.md) ===== */
:root {
  color-scheme: light;
  --color-primary: #451DC7;
  --color-primary-fill: #451DC7;
  --color-on-primary: #FFFFFF;
  --color-surface: #FFFFFF;
  --color-surface-alt: #F6F5FA;
  --color-ink: #0A0A14;
  --color-ink-secondary: #4A4A5E;
  --color-gray-graphic: #8A8A9E;
  --color-line: #E6E6EC;
  --color-link: #451DC7;
  --color-accent-green: #04F06A;
  --color-risk: #FF2A49;
  --color-chart-1: #6A4DE6;
  --color-chart-2: #0E9F5E;
  --color-chart-3: #2F7FD8;
  --color-chart-4: #C98A00;

  /* Nouveaux : couleur d'icône par module (D-R4-a), proposés par cette maquette */
  --color-icon-arena: var(--color-chart-1);
  --color-icon-bench: var(--color-chart-3);
  --color-icon-documents: var(--color-chart-2);
  --color-amber-strong: #A66E00; /* dédié : chart-4 clair ne tient pas 3:1, voir DECISIONS.md */
  --color-icon-models: var(--color-amber-strong);

  /* Nouveau : aplat léger de la primaire sur les zones d'action */
  --color-action-tint: rgba(69, 29, 199, 0.08);

  --radius: 12px;
  --radius-full: 9999px;
  --font-body: Aptos, Inter, sans-serif;
  --font-heading: Aptos, Inter, sans-serif;

  /* Nouvelle rampe (amendement §Typography) : intertitre < libellé de champ principal */
  --text-section-label: 0.8125rem;   /* intertitres "Réglages", "Scénario"... */
  --text-body: 1rem;
  --text-field-label: 1.0625rem;     /* libellé des champs mis en avant (prompt, modèle) */
  --text-caption: 0.875rem;
  --text-heading: 1.75rem;
  --text-metric-value: 2.5rem;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --color-primary: #7E65E9;
  --color-primary-fill: #6A4DE6;
  --color-on-primary: #FFFFFF;
  --color-surface: #0A0A14;
  --color-surface-alt: #16162A;
  --color-ink: #F6F5FA;
  --color-ink-secondary: #B4B4C6;
  --color-line: #2E2E44;
  --color-link: #9B85F0;
  --color-accent-green: #04F06A;
  --color-risk: #FF2A49;
  --color-chart-1: #7A5FEA;
  --color-chart-2: #12A564;
  --color-chart-3: #3B86DB;
  --color-chart-4: #B07800;
  --color-icon-arena: var(--color-chart-1);
  --color-icon-bench: var(--color-chart-3);
  --color-icon-documents: var(--color-chart-2);
  --color-amber-strong: var(--color-chart-4);
  --color-icon-models: var(--color-amber-strong);
  --color-action-tint: rgba(126, 101, 233, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    color-scheme: dark;
    --color-primary: #7E65E9;
    --color-primary-fill: #6A4DE6;
    --color-on-primary: #FFFFFF;
    --color-surface: #0A0A14;
    --color-surface-alt: #16162A;
    --color-ink: #F6F5FA;
    --color-ink-secondary: #B4B4C6;
    --color-line: #2E2E44;
    --color-link: #9B85F0;
    --color-chart-1: #7A5FEA;
    --color-chart-2: #12A564;
    --color-chart-3: #3B86DB;
    --color-chart-4: #B07800;
    --color-icon-arena: var(--color-chart-1);
    --color-icon-bench: var(--color-chart-3);
    --color-icon-documents: var(--color-chart-2);
    --color-amber-strong: var(--color-chart-4);
    --color-icon-models: var(--color-amber-strong);
    --color-action-tint: rgba(126, 101, 233, 0.10);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--color-surface-alt);
  color: var(--color-ink);
  font-family: var(--font-body);
  font-size: var(--text-body);
  line-height: 1.5;
}
h1, h2, h3 { font-family: var(--font-heading); font-weight: 600; margin: 0 0 0.5rem; color: var(--color-ink); }
h1 { font-size: var(--text-heading); }
svg.ico { width: 1.25em; height: 1.25em; vertical-align: -0.2em; fill: currentColor; }

/* ---- Barre d'outils de la maquette (hors cadre simulé) ---- */
.toolbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
  padding: 0.75rem 1rem;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-line);
}
.toolbar strong { font-size: 0.9rem; }
.toolbar label { font-size: var(--text-caption); color: var(--color-ink-secondary); display: flex; align-items: center; gap: 0.35rem; }
.toolbar select, .toolbar button {
  font: inherit; font-size: var(--text-caption);
  border: 1px solid var(--color-line); border-radius: var(--radius);
  background: var(--color-surface); color: var(--color-ink);
  padding: 0.35rem 0.6rem; cursor: pointer;
}
.toolbar button[aria-pressed="true"] { border-color: var(--color-primary); color: var(--color-primary); }
.note { font-size: var(--text-caption); color: var(--color-ink-secondary); margin-left: auto; }

/* ---- Cadre mis à l'échelle ---- */
.stage { padding: 1.5rem 1rem; overflow-x: hidden; }
.scaler { margin: 0 auto; }
#frame { transform-origin: top left; }
#frame {
  background: var(--color-surface);
  color: var(--color-ink);
  border: 1px solid var(--color-line);
  border-radius: var(--radius);
  overflow: hidden;
}
#frame .shell-top {
  display: flex; align-items: center; gap: 1rem;
  padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--color-line);
  background: var(--color-surface);
}
#frame .shell-top .brand { font-weight: 700; color: var(--color-primary); }
#frame .shell-top nav { display: flex; gap: 0.25rem; margin-left: 1rem; flex-wrap: wrap; }
#frame .shell-top nav a {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.35rem 0.6rem; border-radius: var(--radius);
  color: var(--color-ink-secondary); text-decoration: none; font-size: var(--text-caption);
}
#frame .shell-top nav a[aria-current="page"] { background: var(--color-action-tint); color: var(--color-ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--color-primary); }
#frame .shell-top nav a[aria-current="page"] svg { color: var(--color-primary); }
#frame .shell-top .mode { margin-left: auto; font-size: var(--text-caption); color: var(--color-ink-secondary); }

main.screen { padding: 1.25rem 1.5rem 2rem; }
.lead { color: var(--color-ink-secondary); margin: 0 0 1.25rem; max-width: 62ch; }

/* ---- Grille à deux colonnes (≥1400px, pilotée par data-width du cadre) ---- */
.two-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.25rem; align-items: start; }
.two-col > * { min-width: 0; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; }
#frame[data-width="1920"] .two-col,
#frame[data-width="1440"] .two-col {
  grid-template-columns: minmax(480px, 1fr) minmax(320px, 400px);
}
.col-right { display: flex; flex-direction: column; gap: 1rem; }

.section-label {
  font-size: var(--text-section-label);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--color-ink-secondary);
  margin: 0 0 0.5rem;
}
.field-label {
  display: block;
  font-size: var(--text-field-label);
  font-weight: 600;
  color: var(--color-ink);
  margin: 0 0 0.4rem;
}

.card { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius); padding: 1rem; }
.card + .card { margin-top: 0.75rem; }
.stack { display: flex; flex-direction: column; gap: 1rem; }

textarea.big-input {
  width: 100%; min-height: 7rem; resize: vertical;
  font: inherit; font-size: 1rem; font-weight: 400;
  padding: 0.75rem; border: 1px solid var(--color-line); border-radius: var(--radius);
  background: var(--color-surface); color: var(--color-ink);
}
select.plain, input.plain {
  font: inherit; padding: 0.5rem 0.6rem; border: 1px solid var(--color-line);
  border-radius: var(--radius); background: var(--color-surface); color: var(--color-ink); width: 100%;
}

.chip-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
.chip {
  font-size: var(--text-caption); padding: 0.3rem 0.7rem; border-radius: var(--radius-full);
  border: 1px solid var(--color-line); color: var(--color-ink); background: var(--color-surface);
}
.chip[aria-pressed="true"] { background: var(--color-primary-fill); border-color: var(--color-primary-fill); color: var(--color-on-primary); font-weight: 600; }

/* Cartes de choix de modèle */
.model-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0.6rem; }
.model-card {
  border: 1px solid var(--color-line); border-radius: var(--radius); padding: 0.75rem;
  background: var(--color-surface); position: relative;
}
.model-card.selected { border-color: var(--color-primary); background: var(--color-action-tint); }
.model-card .name { font-weight: 600; font-size: 0.95rem; }
.model-card .meta { font-size: var(--text-caption); color: var(--color-ink-secondary); margin-top: 0.15rem; }
.model-card .pick { position: absolute; top: 0.6rem; right: 0.6rem; color: var(--color-primary); }

.toggle-row { display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.5rem 0; }
.toggle-row .switch {
  flex: none; width: 2.1rem; height: 1.2rem; border-radius: var(--radius-full);
  border: 1px solid var(--color-ink-secondary); position: relative; background: var(--color-surface);
}
.toggle-row .switch.on { background: var(--color-primary-fill); border-color: var(--color-primary-fill); }
.toggle-row .switch::after {
  content: ""; position: absolute; top: 1px; left: 1px; width: 1rem; height: 1rem;
  border-radius: 50%; background: var(--color-surface); border: 1px solid var(--color-ink-secondary);
}
.toggle-row .switch.on::after { left: calc(100% - 1.1rem); border-color: transparent; background: var(--color-on-primary); }
.toggle-row .txt .lbl { font-size: 0.9375rem; font-weight: 500; }
.toggle-row .txt .help { font-size: var(--text-caption); color: var(--color-ink-secondary); }

.btn {
  font: inherit; font-size: 0.95rem; font-weight: 600; border-radius: var(--radius);
  padding: 0.6rem 1.1rem; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 0.4rem;
}
.btn-primary { background: var(--color-primary-fill); color: var(--color-on-primary); }
.btn-secondary { background: var(--color-surface); color: var(--color-ink); border-color: var(--color-line); }
.btn-block { width: 100%; justify-content: center; }

.metric-row { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 0.75rem 0; }
.metric .lbl { font-size: var(--text-caption); color: var(--color-ink-secondary); }
.metric .val { font-size: 1.5rem; font-weight: 700; }

.alert {
  display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.85rem 1rem;
  border-radius: var(--radius); border: 1px solid var(--color-line); margin-bottom: 1rem;
}
.alert-warning { background: color-mix(in srgb, var(--color-chart-4) 12%, var(--color-surface)); border-color: var(--color-amber-strong); }
.alert-info { background: var(--color-action-tint); border-color: var(--color-primary); }
.alert .icon { flex: none; color: var(--color-amber-strong); }
.alert-info .icon { color: var(--color-primary); }
.alert p { margin: 0 0 0.5rem; }

.icon-mod { border-radius: var(--radius); padding: 0.4rem; display: inline-flex; }
.icon-mod.arena { color: var(--color-icon-arena); background: color-mix(in srgb, var(--color-icon-arena) 8%, var(--color-surface)); }
.icon-mod.bench { color: var(--color-icon-bench); background: color-mix(in srgb, var(--color-icon-bench) 8%, var(--color-surface)); }
.icon-mod.docs { color: var(--color-icon-documents); background: color-mix(in srgb, var(--color-icon-documents) 8%, var(--color-surface)); }
.icon-mod.models { color: var(--color-icon-models); background: color-mix(in srgb, var(--color-icon-models) 8%, var(--color-surface)); }

.table-wrap { max-width: 100%; overflow-x: auto; }
/* Mobile : chaque ligne devient un bloc étiqueté, sans colonne coupée */
#frame[data-width="390"] table.wl-table,
#frame[data-width="390"] table.wl-table tbody,
#frame[data-width="390"] table.wl-table caption { display: block; }
#frame[data-width="390"] table.wl-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
#frame[data-width="390"] table.wl-table tr { display: block; padding: 0.4rem 0; border-bottom: 1px solid var(--color-line); }
#frame[data-width="390"] table.wl-table td { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding: 0.2rem 0; border: 0; }
#frame[data-width="390"] table.wl-table td::before { content: attr(data-label); color: var(--color-ink-secondary); font-size: var(--text-caption); }
.dropzone-disabled { border-style: dashed; background: var(--color-surface-alt); }
.dropzone-disabled .field-label, .dropzone-disabled p { color: var(--color-ink-secondary); }
table.wl-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.wl-table caption { text-align: left; font-size: var(--text-caption); color: var(--color-ink-secondary); padding-bottom: 0.4rem; }
table.wl-table th, table.wl-table td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--color-line); }
table.wl-table th { font-size: var(--text-caption); color: var(--color-ink-secondary); font-weight: 600; }

.lane-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0.75rem; }
.lane { border: 1px solid var(--color-line); border-radius: var(--radius); padding: 0.85rem; background: var(--color-surface); }
.lane .lane-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }
.lane .lane-head .name { font-weight: 600; }
.lane .status { font-size: var(--text-caption); color: var(--color-ink-secondary); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.3rem; }
.lane .status.stopped { color: var(--color-ink); font-weight: 600; }
.lane .status.stopped svg { color: var(--color-risk); }
.lane .response { font-size: 0.9rem; color: var(--color-ink); }
.lane .score { margin-top: 0.5rem; font-weight: 700; }

.judge-banner {
  display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.9rem;
  border-radius: var(--radius); background: var(--color-action-tint); color: var(--color-ink);
  font-size: 0.9rem; margin-bottom: 0.9rem;
}
.judge-banner svg { color: var(--color-primary); }
.badge-local { background: color-mix(in srgb, var(--color-accent-green) 22%, var(--color-surface)); color: var(--color-ink); border-radius: var(--radius-full); padding: 0.1rem 0.55rem; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 0.25rem; }

details.collapsed-settings { border: 1px solid var(--color-line); border-radius: var(--radius); padding: 0.6rem 0.85rem; background: var(--color-surface); }
details.collapsed-settings summary { cursor: pointer; font-size: var(--text-section-label); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-ink-secondary); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
</style>
</head>

const SCREENS = {
  "bench": screenBench,
  "arena-form": screenArenaForm,
  "arena-results": screenArenaResults,
  "docs-base": screenDocsBase,
  "models": screenModels,
};

const selScreen = document.getElementById('sel-screen');
const selWidth = document.getElementById('sel-width');
const btnTheme = document.getElementById('btn-theme');
const frame = document.getElementById('frame');
const screenRoot = document.getElementById('screen-root');
const scaler = document.getElementById('scaler');
const stage = document.querySelector('.stage');

function render() {
  screenRoot.innerHTML = SCREENS[selScreen.value]();
  screenRoot.querySelectorAll('table.wl-table').forEach((table) => {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    table.replaceWith(wrap);
    wrap.appendChild(table);
    const heads = [...table.querySelectorAll('thead th')].map((th) => th.textContent);
    table.querySelectorAll('tbody tr').forEach((tr) => {
      [...tr.children].forEach((td, i) => td.setAttribute('data-label', heads[i] || ''));
    });
  });
  rescale();
}

function applyWidth() {
  const w = WIDTHS[selWidth.value];
  frame.style.width = w + 'px';
  frame.setAttribute('data-width', selWidth.value);
  rescale();
}

/* Le cadre garde sa largeur simulée ; transform ne change pas la boîte de mise en page,
   donc le conteneur prend la taille mise à l'échelle pour ne créer aucun défilement. */
function rescale() {
  const cs = getComputedStyle(stage);
  const available = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const w = WIDTHS[selWidth.value];
  const scale = Math.min(1, available / w);
  frame.style.transform = scale < 1 ? `scale(${scale})` : 'none';
  scaler.style.width = (w * scale) + 'px';
  scaler.style.height = (frame.offsetHeight * scale) + 'px';
}

function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  btnTheme.textContent = 'Thème : ' + (dark ? 'sombre' : 'clair');
  btnTheme.setAttribute('aria-pressed', String(dark));
}

selScreen.addEventListener('change', render);
selWidth.addEventListener('change', applyWidth);
btnTheme.addEventListener('click', () => {
  applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
});
window.addEventListener('resize', rescale);
new ResizeObserver(rescale).observe(frame);

applyTheme(false);
applyWidth();
render();
rescale();
</script>
