# Réglages versionnés de la v2 (AD-15). Chargés une fois au démarrage par `wavelocalai/config.py`,
# jamais réécrits par l'application. Les secrets (clés d'API) vont dans `.env`, jamais ici ;
# ce que l'interface modifie vit dans la table `preferences`.

[server]
# 8501 reste à la v1. Écoute sur 127.0.0.1 seulement (AD-19).
port = 8502

[data]
# Dossier des données (base, journaux, caches). Relatif à ce fichier.
dir = "data"

[ollama]
# 127.0.0.1 et non localhost : sur certains postes, localhost résout en IPv6 et échoue.
host = "http://127.0.0.1:11434"
probe_timeout_s = 1.0  # délai de la sonde de santé (1 s au plus, AD-15)
probe_cache_s = 5.0    # durée de vie de l'état d'Ollama en cache

[carbon]
country_iso = "FRA"
pue = 1.1

[delays]
lane_timeout_s = 300.0    # délai d'une lane d'Arène, depuis l'acquisition du sémaphore (local)
approval_expiry_s = 600.0 # sans réponse en 10 minutes, une approbation vaut refus

[cloud.models]
# Modèles cloud proposés par fournisseur, une fois la clé présente dans `.env` ET `allow_cloud`
# demandé (listes fixes : aucun fournisseur n'est appelé pour les lister). Identifiant exposé :
# `fournisseur/modèle`. Identifiants vérifiés dans la documentation officielle des fournisseurs
# le 2026-10-18 (story 2.4) : OpenAI (`gpt-6-sol`, `gpt-6-luna` ; `gpt-4o` et `gpt-4o-mini` sont
# dépréciés, arrêt le 2027-01-14), Groq (production), Anthropic (alias de l'aperçu des modèles),
# Mistral (`mistral-large-latest` et `mistral-small-latest` figurent dans la référence de
# l'API ; `mistral-medium-latest` n'y est pas confirmé, retiré).
openai = ["gpt-6-sol", "gpt-6-luna"]
groq = ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "llama-3.3-70b-versatile", "llama-3.1-8b-instant"]
anthropic = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
mistral = ["mistral-large-latest", "mistral-small-latest"]

[cloud.groq_ecologits]
# Modèle Groq -> entrée `huggingface_hub` d'ecologits (AD-11). Sans entrée, le CO2 d'un modèle
# Groq est « non mesurable » (raison affichée). Entrées confirmées le 2026-10-18 (story 2.5) contre
# ecologits 0.11.3 par `tests/v2/unit/test_cloud_estimate.py` : chacune doit exister dans le
# référentiel installé. `llama-3.3-70b-versatile` n'a pas d'entrée : ecologits ne connaît pas
# Llama 3.3, et Llama 3.1 70B est un autre modèle (pas de correspondance inventée).
"openai/gpt-oss-120b" = "openai/gpt-oss-120b"
"openai/gpt-oss-20b" = "openai/gpt-oss-20b"
"llama-3.1-8b-instant" = "meta-llama/Meta-Llama-3.1-8B-Instruct"

[rag]
# Base documentaire (story 4.1). Les extraits mesurent `chunk_size` caractères, avec
# `chunk_overlap` de recouvrement ; chaque lot de `embed_batch_size` extraits est une feuille
# `embedding` mesurée par CodeCarbon. `embedding_model` : défaut de la base ; absent, le premier
# modèle d'embedding installé dans Ollama.
chunk_size = 800
chunk_overlap = 100
embed_batch_size = 16
max_file_mb = 50
# Plafonds d'un import (story 4.2) : nombre de fichiers et taille totale, vérifiés par l'écran
# avant l'envoi puis par la route.
max_files = 50
max_import_mb = 500

# Question (story 4.4) : `top_k` extraits cités par réponse ; seuils du libellé de pertinence sur la
# similarité cosinus (1 - distance), calés sur nomic-embed-text : au moins `relevance_very_close`
# = « très proche », au moins `relevance_close` = « proche », en dessous = « éloignée ».
top_k = 4
# Self-RAG (story 4.6) : au plus `self_rag_max_iterations` reformulations de la question (donc au
# plus 1 + n recherches) ; la borne atteinte, la réponse part avec les meilleurs extraits trouvés.
self_rag_max_iterations = 2
relevance_very_close = 0.70
relevance_close = 0.60
