name: Stabilite CI (story 8.5)

# Rejoue, a la demande seulement, les sept tests signales instables au temps ou a l'ordre de la
# suite pendant le run de l'Epic 9 (5 relances de job sur 12 PR, jamais pour un defaut reel) :
# chacun doit passer 20 fois de suite sur les trois OS, arret au premier echec (jamais de relance).
# Jamais sur push ni PR : une fois la stabilite prouvee, le controle rapide, la CI de branche
# (tests.yml) et la suite nocturne (e2e-nocturne.yml) suffisent.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stabilite:
    name: Stabilite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      PYTHONUTF8: "1"

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: '3.12'
        enable-cache: true

    # uv.lock fait foi : le job echoue s'il n'est plus a jour avec pyproject.toml.
    - name: Install dependencies
      run: uv sync --locked

    # Chromium de Playwright, dans la version verrouillee par uv.lock (aucun Edge hors Windows).
    - name: Install Chromium (Playwright)
      run: uv run --locked python -m playwright install --with-deps chromium

    # `-m "e2e or not e2e"` annule le `-m "not e2e"` par defaut de pytest.ini (`addopts`) : les
    # tests web et E2E de la liste tournent dans le meme passage. Vingt passages, arret au premier
    # echec a l'interieur d'un passage (`-x`) : une relance reviendrait a l'outillage, pas au test.
    - name: Rejouer 20 fois les sept tests autrefois instables
      shell: bash
      run: |
        tests=(
          "tests/v2/web/test_conversations_api.py::test_routes_with_a_path_parameter_stay_under_the_read_budget"
          "tests/v2/web/test_model_card_api.py::test_the_card_answers_under_300_ms_with_ollama_down"
          "tests/v2/web/test_arena_api.py::test_lane_timeout_counts_from_the_slot_not_from_the_wait"
          "tests/v2/e2e/test_shell.py::test_shell_renders_under_300_ms_without_waiting_for_the_api_ollama_stopped"
          "tests/v2/e2e/test_arena.py::test_axe_finds_no_violation_with_four_models_the_summary_and_the_folded_answers"
          "tests/v2/e2e/test_models_manage.py::test_deleting_asks_first_with_the_focus_on_cancel_then_removes_the_model"
          "tests/v2/e2e/test_accessibilite.py::test_every_screen_has_one_h1_a_distinct_title_and_the_french_language"
        )
        for n in $(seq 1 20); do
          echo "::group::Passage $n/20"
          uv run --locked python -m pytest "${tests[@]}" -m "e2e or not e2e" -x -q --tb=short
          echo "::endgroup::"
        done
