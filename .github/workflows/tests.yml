name: Tests & Quality

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Un nouveau push sur une PR annule le run précédent de la même PR, devenu inutile ; les runs de
# master ne s'annulent jamais (chaque fusion garde le sien).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ce que la PR touche, pour ne lancer que les jobs utiles (CI allégée, accord d'Anaël du
  # 2026-10-19) : la v1, en correctifs seulement, n'est testée que si une PR la touche, et une PR
  # qui ne modifie que `_bmad-output/` (fichiers d'état du run, specs) ne lance aucun test. Sur
  # master, tout tourne toujours.
  changes:
    name: Fichiers touchés
    runs-on: ubuntu-latest
    outputs:
      v1: ${{ steps.diff.outputs.v1 }}
      code: ${{ steps.diff.outputs.code }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Comparer à la base
      id: diff
      run: |
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "v1=true" >> "$GITHUB_OUTPUT"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
        echo "$files"
        # Tout ce qui n'est pas dans `_bmad-output/` est du code ou de la configuration.
        if echo "$files" | grep -qv '^_bmad-output/'; then code=true; else code=false; fi
        # Ce que lit la v1 : `src/` hors `src/wavelocalai/`, ses tests, ses dépendances, sa
        # configuration, les scripts, et la CI elle-même.
        if echo "$files" | grep -qE '^(src/(app|core)/|src/[^/]+$|tests/(unit|app|integration)/|tests/[^/]+$|requirements\.txt|constraints\.txt|pyproject\.toml|pytest\.ini|config/|scripts/|\.github/)'; then v1=true; else v1=false; fi
        echo "code=$code" >> "$GITHUB_OUTPUT"; echo "v1=$v1" >> "$GITHUB_OUTPUT"
        echo "code=$code v1=$v1"

  lint:
    name: Code Quality (Linting)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort

    # Lint informatif : aucune de ces étapes ne bloque la CI.
    - name: Run Ruff (Linter)
      run: ruff check src/ tests/ --output-format=github
      continue-on-error: true

    - name: Check Black (Formatter)
      run: black --check src/ tests/
      continue-on-error: true

    - name: Check isort (Imports)
      run: isort --check-only src/ tests/
      continue-on-error: true

  test:
    name: Unit & App Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.v1 == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          constraints.txt

    # Versions figées par constraints.txt (généré par uv pip compile --universal).
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -c constraints.txt

    # Sans Ollama, clé d'API ni réseau : tests/integration est exclu.
    - name: Run Unit & App Tests
      run: |
        python -m pytest tests/unit tests/app --cov=src.core --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-v2:
    name: Tests v2 (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    # uv.lock fait foi : le job échoue s'il n'est plus à jour avec pyproject.toml.
    - name: Install dependencies
      run: uv sync --locked

    - name: Run v2 Tests
      run: uv run --locked python -m pytest tests/v2

  # Parcours navigateur de la v2 (`tests/v2/e2e`, marqueur `e2e`) : Chromium de Playwright, dans la
  # version verrouillée par uv.lock. Bloquant comme les autres jobs de tests. Les parcours qui
  # exigent Ollama ou un vrai modèle sont `integration` et ne tournent pas ici.
  # La suite dure ~25 min en un seul bloc (mesure locale, Windows) : trois morceaux par fichiers
  # (un fichier sur trois, dans l'ordre alphabétique), sans dépendance de plus. Un nouveau fichier
  # de tests tombe de lui-même dans un morceau.
  test-v2-e2e:
    name: E2E v2 (ubuntu-latest, Python 3.12, morceau ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked

    - name: Install Chromium (Playwright)
      run: uv run --locked python -m playwright install --with-deps chromium

    - name: Run v2 E2E Tests (morceau ${{ matrix.shard }}/3)
      run: |
        files=$(ls tests/v2/e2e/test_*.py | awk -v n=${{ matrix.shard }} 'NR % 3 == n')
        echo "Fichiers : $files"
        uv run --locked python -m pytest $files -m e2e

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit (Security)
      run: bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Run Safety (Dependencies)
      run: safety check --json
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
