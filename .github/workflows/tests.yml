name: Tests & Quality

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Code Quality (Linting)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort

    # Lint informatif : aucune de ces étapes ne bloque la CI.
    - name: Run Ruff (Linter)
      run: ruff check src/ tests/ --output-format=github
      continue-on-error: true

    - name: Check Black (Formatter)
      run: black --check src/ tests/
      continue-on-error: true

    - name: Check isort (Imports)
      run: isort --check-only src/ tests/
      continue-on-error: true

  test:
    name: Unit & App Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          constraints.txt

    # Versions figées par constraints.txt (généré par uv pip compile --universal).
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -c constraints.txt

    # Sans Ollama, clé d'API ni réseau : tests/integration est exclu.
    - name: Run Unit & App Tests
      run: |
        python -m pytest tests/unit tests/app --cov=src.core --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit (Security)
      run: bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Run Safety (Dependencies)
      run: safety check --json
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
