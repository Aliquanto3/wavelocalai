[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wavelocalai"
version = "1.3.0"
description = "Démonstrateur de petits modèles de langage locaux (Ollama) avec mesure carbone (CodeCarbon)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    # --- Frontend & UI ---
    "streamlit>=1.64.0",
    "watchdog>=4.0.0",
    "plotly>=5.19.0",
    # --- AI Core & Orchestration ---
    "langchain>=0.3.0",
    # 0.4.2 retire langchain_community.chat_models.vertexai, qu'importe ragas 0.4.3 :
    # `import ragas` échoue avec cette version (0.4.1 vérifiée compatible).
    "langchain-community>=0.3.0,!=0.4.2",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.50",
    "ollama>=0.4.0",
    "httpx>=0.27.0",
    # --- Data & Utilities ---
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",  # Excel (Data Analyzer)
    "xlrd>=2.0.1",  # Excel ancien format
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "numexpr>=2.8.0",
    "matplotlib>=3.7.0",  # Chart Generator
    "python-docx>=1.0.0",  # Document Generator
    "docx2txt>=0.9",  # Import DOCX de l'assistant documentaire (Docx2txtLoader)
    # Gestion des boucles asynchrones (indispensable pour Streamlit + Agents)
    "nest_asyncio",
    # Gestion des timeouts pour les benchmarks
    "func-timeout",
    # --- Hardware & Green IT ---
    "codecarbon>=2.8.0",
    "psutil>=6.0.0",
    # GPUtil requiert setuptools sur Python 3.12+ (car distutils a été supprimé)
    "setuptools>=70.0.0",
    "GPUtil>=1.4.0",
    # Détection du GPU NVIDIA (module pynvml) de « Sobriété et matériel » ; déjà tiré par
    # codecarbon, déclaré car importé directement.
    "nvidia-ml-py>=13.615.71",
    "py-cpuinfo>=9.0.0",
    # --- RAG & Vector Store ---
    "chromadb>=0.4.22",
    # onnxruntime (dépendance de chromadb) n'a plus de wheel cp310 à partir de 1.24 : version par Python
    "onnxruntime<1.24 ; python_version < '3.11'",
    "onnxruntime>=1.24 ; python_version >= '3.11'",
    "pypdf>=4.0.0",
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.0.1",
    "langchain-chroma>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "huggingface-hub>=0.23.0",
    "einops",  # requis par le code distant des modèles Jina (trust_remote_code)
    # torch est déclaré ici (tiré par sentence-transformers) pour que [tool.uv.sources] puisse
    # lui appliquer l'index CPU sous Linux : une source ne vaut que pour une dépendance directe.
    "torch",
    # Évaluation RAG
    "ragas>=0.1.0",
    "datasets>=2.19.0",
    # --- V2 : Hybrid & Agents ---
    "langchain-mistralai>=0.1.0",
    "mistralai>=1.0.0",
    "anthropic>=1.15.0",
    "langchain-anthropic>=0.3.0",
    "openai>=1.50.0",
    "langchain-openai>=0.2.0",
    # Fix pour CrewAI/LangChain (conflit Pydantic v2)
    "crewai>=0.30.0",
    "graphviz>=0.20.1",
]

[project.scripts]
wavelocalai = "src.app.launcher:main"

[dependency-groups]
dev = [
    # Tests unitaires
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "toml",  # importé par tests/app et tests/e2e (lecture de .streamlit/config.toml)
    "jsonschema",  # scripts/sync_slm_results.py (validation des résultats slm-quality-bench)
    # Parcours navigateur (tests/e2e) ; le navigateur s'installe à part :
    # uv run python -m playwright install chromium
    "playwright>=1.63.0",
    "axe-playwright-python>=0.1.8",
    # Qualité du code & sécurité (hooks Git)
    "pre-commit",
    "detect-secrets",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
dev-mode-dirs = ["."]

# torch : sous Linux, PyPI tire les wheels CUDA (plusieurs Go). Index CPU réservé à Linux ;
# Windows et macOS gardent PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[tool.coverage.run]
source = ["src/core"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/config.py",  # Configuration simple, peu de logique
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

# Seuils de qualité
fail_under = 70.0

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
# Configuration pytest (fusion avec pytest.ini existant)
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = [
    "asyncio: Marque les tests asynchrones",
    "integration: Tests nécessitant Ollama (lents)",
    "unit: Tests unitaires rapides"
]

addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src.core",
    "--cov-report=term-missing",
    "--cov-report=html",
]

testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py310"

# DÉPLACER ces 3 sections dans [tool.ruff.lint]
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

ignore = [
    "E501",  # line too long (géré par black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "I",     # Fusionné depuis l'ancien [tool.ruff.lint]
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F811"]
