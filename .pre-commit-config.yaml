# Configuration pre-commit pour WaveLocalAI
# Installation : pip install pre-commit && pre-commit install

# BMAD est du code tiers, régénéré à chaque mise à jour : ni formatage ni scan de secrets
# (files-manifest.csv contient des empreintes SHA que detect-secrets prend pour des secrets).
exclude: ^(_bmad/|\.claude/skills/bmad-)

repos:
  # Hooks génériques
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Code emprunté du banc de qualité : octets tels que publiés (sha256 de PROVENANCE.md).
      - id: trailing-whitespace
        exclude: ^scripts/quality_bench/(grading|envs)/vendored/
      - id: end-of-file-fixer
        exclude: ^scripts/quality_bench/(grading|envs)/vendored/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-json
      - id: check-toml
      - id: detect-private-key

  # Python : Formatage (le code emprunté du banc de qualité reste tel que publié)
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black
        exclude: ^scripts/quality_bench/(grading|envs)/vendored/

  # Python : Imports
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
        exclude: ^scripts/quality_bench/(grading|envs)/vendored/

  # Python : Linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^scripts/quality_bench/(grading|envs)/vendored/

  # Secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Exports versionnés du banc de qualité : empreintes sha256 prises pour des secrets.
        exclude: ^benchmarks/quality/
